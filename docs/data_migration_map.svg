<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1010" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1b2d"/><stop offset="1" stop-color="#16243b"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7aa7d6"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1660" height="1010" fill="url(#bg)"/>
  <text x="40" y="50" fill="#fff" font-size="28" font-weight="700">Data migration map — source to gold</text>
  <text x="40" y="80" fill="#9db4d0" font-size="16">Finance_Bronze lakehouse · medallion ELT · numbered tags = the real-world data issues fixed along the way (legend below)</text>

  <!-- band headers -->
  <text x="48"   y="128" fill="#7aa7d6" font-size="13" font-weight="700" letter-spacing="1">SOURCE SYSTEMS</text>
  <text x="330"  y="128" fill="#e3b760" font-size="13" font-weight="700" letter-spacing="1">BRONZE — land raw</text>
  <text x="612"  y="128" fill="#c7bdf0" font-size="13" font-weight="700" letter-spacing="1">SILVER — cleanse &amp; conform</text>
  <text x="972"  y="128" fill="#c7bdf0" font-size="13" font-weight="700" letter-spacing="1">GOLD — model</text>
  <text x="1332" y="128" fill="#f08aa6" font-size="13" font-weight="700" letter-spacing="1">SERVE</text>

  <!-- SOURCE -->
  <g filter="url(#sh)"><rect x="40" y="142" width="258" height="470" rx="14" fill="#1e2f49" stroke="#33507a"/></g>
  <g font-size="13" fill="#dce7f5">
    <rect x="58" y="162" width="222" height="86" rx="9" fill="#26405f"/>
    <text x="72" y="188" font-weight="700">Core Banking DB</text><text x="72" y="208" font-size="11.5" fill="#9db4d0">SQL Server (a source)</text>
    <text x="72" y="232" font-size="12">customers · accounts</text>
    <rect x="58" y="260" width="222" height="64" rx="9" fill="#26405f"/>
    <text x="72" y="284" font-weight="700">Cards platform</text><text x="72" y="306" font-size="12">transactions (CSV files)</text>
    <rect x="58" y="336" width="222" height="64" rx="9" fill="#26405f"/>
    <text x="72" y="360" font-weight="700">Merchant feed</text><text x="72" y="382" font-size="12">merchants (REST API/JSON)</text>
    <rect x="58" y="412" width="222" height="78" rx="9" fill="#2f3b2a"/>
    <text x="72" y="436" font-weight="700" fill="#cfe0bd">Reference data</text><text x="72" y="456" font-size="11.5" fill="#aac79a">→ dbt seeds (lookups)</text>
    <text x="72" y="476" font-size="11.5" fill="#aac79a">currency · country · category</text>
  </g>

  <!-- BRONZE -->
  <g filter="url(#sh)"><rect x="320" y="142" width="258" height="470" rx="14" fill="#3a2c12" stroke="#7a5c23"/></g>
  <text x="340" y="172" fill="#e9d3a0" font-size="12.5">raw, as-received + audit columns</text>
  <g font-size="13" fill="#f0dca8">
    <rect x="338" y="186" width="222" height="40" rx="8" fill="#4a3917"/><text x="352" y="211">bronze_customers</text>
    <rect x="338" y="234" width="222" height="40" rx="8" fill="#4a3917"/><text x="352" y="259">bronze_accounts</text>
    <rect x="338" y="282" width="222" height="40" rx="8" fill="#4a3917"/><text x="352" y="307">bronze_transactions</text>
    <rect x="338" y="330" width="222" height="40" rx="8" fill="#4a3917"/><text x="352" y="355">bronze_merchants</text>
  </g>
  <text x="340" y="402" fill="#c8b069" font-size="11.5">seeds in Files:</text>
  <text x="340" y="420" fill="#c8b069" font-size="11.5">currency · country · category</text>
  <text x="340" y="460" fill="#9a7f3a" font-size="11.5">load via Copy job (Files → tables)</text>
  <text x="340" y="478" fill="#9a7f3a" font-size="11.5">incremental: folder-per-load (9)</text>

  <!-- SILVER -->
  <g filter="url(#sh)"><rect x="600" y="142" width="350" height="470" rx="14" fill="#2a2742" stroke="#574f86"/></g>
  <g font-size="12.5" fill="#ddd6f7">
    <rect x="618" y="160" width="314" height="64" rx="9" fill="#3a3660"/>
    <text x="632" y="182" font-weight="700">stg_customers</text>
    <text x="632" y="204" font-size="11.5" fill="#c3bbe8">dedupe(1) · trim(3) · norm country(2) · KYC→UNKNOWN(4)</text>
    <rect x="618" y="232" width="314" height="52" rx="9" fill="#3a3660"/>
    <text x="632" y="254" font-weight="700">stg_accounts</text>
    <text x="632" y="274" font-size="11.5" fill="#c3bbe8">standardise type/status(8) · cast types(5)</text>
    <rect x="618" y="292" width="314" height="52" rx="9" fill="#3a3660"/>
    <text x="632" y="314" font-weight="700">stg_transactions</text>
    <text x="632" y="334" font-size="11.5" fill="#c3bbe8">cast amount/timestamp(5) · std status(8) · txn_date</text>
    <rect x="618" y="352" width="314" height="52" rx="9" fill="#3a3660"/>
    <text x="632" y="374" font-weight="700">stg_merchants</text>
    <text x="632" y="394" font-size="11.5" fill="#c3bbe8">trim · norm country(2) · + category group</text>
    <rect x="618" y="412" width="314" height="58" rx="9" fill="#46407a"/>
    <text x="632" y="434" font-weight="700" fill="#e3ddfb">enrichment</text>
    <text x="632" y="455" font-size="11.5" fill="#d8d0f6">amount → USD(6) via currency · + region</text>
  </g>

  <!-- GOLD -->
  <g filter="url(#sh)"><rect x="960" y="142" width="350" height="470" rx="14" fill="#2a2742" stroke="#6a5fa0"/></g>
  <g font-size="12.5" fill="#e3ddfb">
    <text x="978" y="170" fill="#b9aef0" font-size="11.5" font-weight="700">DIMENSIONS (surrogate keys)</text>
    <rect x="978" y="178" width="314" height="34" rx="8" fill="#46407a"/><text x="992" y="200">dim_customers</text>
    <rect x="978" y="216" width="314" height="34" rx="8" fill="#46407a"/><text x="992" y="238">dim_accounts</text>
    <rect x="978" y="254" width="314" height="34" rx="8" fill="#46407a"/><text x="992" y="276">dim_merchants  · + Unknown member(7)</text>
    <text x="978" y="312" fill="#b9aef0" font-size="11.5" font-weight="700">FACT</text>
    <rect x="978" y="320" width="314" height="44" rx="8" fill="#574f86"/>
    <text x="992" y="340">fct_transactions</text><text x="992" y="357" font-size="11" fill="#d8d0f6">amount_usd · risk flags(10)</text>
    <text x="978" y="400" fill="#b9aef0" font-size="11.5" font-weight="700">MARTS</text>
    <rect x="978" y="408" width="314" height="34" rx="8" fill="#574f86"/><text x="992" y="430">customer_360</text>
    <rect x="978" y="446" width="314" height="44" rx="8" fill="#5e3b52"/>
    <text x="992" y="466" fill="#f3cfe0">flagged_transactions</text><text x="992" y="483" font-size="11" fill="#e6b9d0">fraud queue · risk score 0–4 (10)</text>
  </g>

  <!-- SERVE -->
  <g filter="url(#sh)"><rect x="1332" y="142" width="288" height="470" rx="14" fill="#3a1320" stroke="#7a2740"/></g>
  <text x="1476" y="300" fill="#f08aa6" font-size="18" font-weight="700" text-anchor="middle">Power BI</text>
  <g font-size="12.5" fill="#f6c0cf" text-anchor="middle">
    <text x="1476" y="332">spend by region / month</text>
    <text x="1476" y="356">top customers (360)</text>
    <text x="1476" y="380">fraud-review page</text>
  </g>
  <text x="1476" y="430" fill="#c98aa0" font-size="11.5" text-anchor="middle">refreshes only on a</text>
  <text x="1476" y="448" fill="#c98aa0" font-size="11.5" text-anchor="middle">passed quality gate</text>

  <!-- arrows -->
  <g stroke="#7aa7d6" stroke-width="2.5" fill="none">
    <line x1="300" y1="377" x2="316" y2="377" marker-end="url(#ar)"/>
    <line x1="580" y1="377" x2="596" y2="377" marker-end="url(#ar)"/>
    <line x1="952" y1="377" x2="956" y2="377" marker-end="url(#ar)"/>
    <line x1="1312" y1="377" x2="1328" y2="377" marker-end="url(#ar)"/>
  </g>

  <!-- quality gate banner -->
  <g filter="url(#sh)"><rect x="40" y="636" width="1580" height="48" rx="10" fill="#10342a" stroke="#1c6e52"/></g>
  <text x="60" y="666" fill="#7ee0b8" font-size="14" font-weight="700">QUALITY GATE —</text>
  <text x="225" y="666" fill="#bff0dc" font-size="13.5">dbt tests run at every layer: not_null · unique · relationships · accepted_values · 2+ singular tests · source freshness  →  gold refresh only if all pass</text>

  <!-- data issues legend -->
  <text x="40" y="724" fill="#7aa7d6" font-size="14" font-weight="700" letter-spacing="1">DATA ISSUES RESOLVED ALONG THE WAY</text>
  <g filter="url(#sh)"><rect x="40" y="736" width="1580" height="230" rx="12" fill="#142133" stroke="#33507a"/></g>
  <g font-size="13" fill="#cdddf0">
    <text x="64" y="772" fill="#7ee0b8" font-weight="700">1</text><text x="84" y="772">Duplicate customer keys → de-duplicate</text>
    <text x="64" y="806" fill="#7ee0b8" font-weight="700">2</text><text x="84" y="806">Messy country text → normalise (+ region)</text>
    <text x="64" y="840" fill="#7ee0b8" font-weight="700">3</text><text x="84" y="840">Mixed casing / whitespace → trim &amp; standardise</text>
    <text x="64" y="874" fill="#7ee0b8" font-weight="700">4</text><text x="84" y="874">Blank KYC status → default to UNKNOWN</text>
    <text x="64" y="908" fill="#7ee0b8" font-weight="700">5</text><text x="84" y="908">Text dates/amounts → cast to proper types</text>

    <text x="864" y="772" fill="#7ee0b8" font-weight="700">6</text><text x="884" y="772">Multi-currency → convert to amount_usd</text>
    <text x="864" y="806" fill="#7ee0b8" font-weight="700">7</text><text x="884" y="806">Orphan merchant (MER9999) → Unknown member, no rows lost</text>
    <text x="864" y="840" fill="#7ee0b8" font-weight="700">8</text><text x="884" y="840">Status/type variants → standardise to accepted set</text>
    <text x="864" y="874" fill="#7ee0b8" font-weight="700">9</text><text x="884" y="874">Day-2 changed rows → incremental load + merge on key</text>
    <text x="864" y="908" fill="#7ee0b8" font-weight="700">10</text><text x="884" y="908">Suspicious transactions → risk flags + 0–4 score</text>
    <text x="64" y="944" fill="#6f88a8" font-size="12">Each issue maps to the tagged step above and to the table in WORK_ORDER.md — handle it, then prove it with a test.</text>
  </g>
</svg>
